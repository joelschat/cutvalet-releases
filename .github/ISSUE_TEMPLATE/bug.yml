name: Bug report
description: Something in Cut Valet did not do what you expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The fastest fix comes from the app's own record of what happened:
        in Cut Valet choose **Help > Send Diagnostics** right after it happens, and say when you sent it below.
        Logs live in `~/DVEA/logs/` (Windows: `C:\Users\<you>\DVEA\logs\`).
  - type: dropdown
    id: version
    attributes:
      label: Cut Valet version
      description: "Shown in Cut Valet > About Cut Valet."
      options:
        - "1.3.20"
        - "1.3.19"
        - "1.3.18"
        - "1.3.16"
        - "1.3.15"
        - "Older than 1.3.15"
        - "Not sure"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple silicon)
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What you did, and what happened
      description: The steps, in order, and about what time it happened (so the log lines can be found).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: dvea-log
    attributes:
      label: dvea.log excerpt
      description: The lines around the time it happened, from `dvea.log` in the logs folder. Check them for anything private first.
      render: shell
    validations:
      required: true
  - type: input
    id: diagnostics-sent
    attributes:
      label: When you sent Help > Send Diagnostics
      description: The date and rough time (and your time zone), or "not sent". It lets the bundle be matched to this report.
    validations:
      required: true
  - type: textarea
    id: other-logs
    attributes:
      label: inference.log or crash.log excerpt (optional)
      description: "`inference.log` covers transcription and descriptions; `crash.log` has crash tracebacks."
      render: shell
    validations:
      required: false
